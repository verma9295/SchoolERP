<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SchoolERP</title>
    <script type="text/javascript">
      // GitHub Pages is a static host with no server-side rewrites, so a direct
      // navigation or refresh on a client-side route (e.g. /SchoolERP/login)
      // 404s here instead of loading index.html. This encodes the path/query/
      // hash into a query string against the site root and redirects there;
      // the matching script in index.html decodes it back via
      // history.replaceState before React Router ever reads the URL.
      // Adapted from https://github.com/rafgraph/spa-github-pages (MIT).
      var pathSegmentsToKeep = 1; // keep "/SchoolERP" (the repo name segment)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
