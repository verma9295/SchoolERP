      // Reverses the 404.html redirect encoding (see public/404.html) - restores
      // the real path via history.replaceState before React Router reads the URL.

        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
